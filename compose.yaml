services:
  mysql:
    image: mysql:8.0
    container_name: corralon-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-corralon_db}
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    # Verifica que MySQL esté listo antes de arrancar la app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - corralon-network

  app:
    build: .
    container_name: corralon-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql          # nombre del servicio mysql en la red interna
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-corralon_db}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - corralon-network

volumes:
  mysql_data:

networks:
  corralon-network:
    driver: bridge
